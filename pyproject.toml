[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-sim-engine"
version = "0.1.0"
description = "Stateful Habitat simulation and asynchronous vLLM policy services"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.136,<0.137", "uvicorn>=0.34,<1", "httpx>=0.28,<0.29",
                "pydantic>=2.11,<3", "numpy>=1.26,<3", "pillow>=10.4,<13", "jinja2>=3.1,<4"]

[project.optional-dependencies]
policy = ["vllm==0.19.1", "transformers==5.6.0", "qwen-vl-utils==0.0.14"]
habitat = ["numpy>=1.26,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
sim-engine = "sim_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim_engine = ["templates/*.jinja", "templates/navigation_v2/*.jinja", "navigation/*.cpp", "navigation/*.h", "licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]
